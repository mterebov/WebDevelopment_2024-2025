<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Технокарта</title>
    <style>
        #notification {
            position: absolute;
            background: #222;
            color: #fff;
            padding: 10px;
            border-radius: 10px;
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <audio id="win95sound" src="{{ url_for('static', filename='windows95.mp3') }}"></audio>
    <img src="{{ url_for('static', filename='technomeme.jpeg') }}" usemap="#techmap" alt="Техномем" width="1365" height="768">

    <map name="techmap">
        <!-- Примерные координаты -->
        <area shape="rect" coords="30,440,380,750" href="#" onclick="showNotification('В питере обязательно будет кольцевая ветка...')" alt="Метро">
        <area shape="rect" coords="430,270,840,720" href="https://en.wikipedia.org/wiki/Linux_for_PlayStation_2" target="_blank" alt="PS2_linux">
        <area shape="rect" coords="870,40,1320,300" href="#" onclick="changeBackground()" alt="Монитор">
        <area shape="rect" coords="930,520,1300,750" href="#" onclick="playWin95Sound()" alt="Банка Windows 95">
        <area shape="circle" coords="180,180,100" href="#" onclick="alert('Вы разогнали FX до 8 GHz')" alt="8GHz">
    </map>

    <div id="notification"></div>

    <script>
        function showNotification(text) {
            const note = document.getElementById('notification');
            note.innerText = text;
            note.style.left = event.pageX + 'px';
            note.style.top = event.pageY + 'px';
            note.style.display = 'block';
            setTimeout(() => { note.style.display = 'none'; }, 5000);
        }

        function changeBackground() {
            document.body.style.backgroundColor = "#" + Math.floor(Math.random()*16777215).toString(16);
        }

        function playWin95Sound() {
            const audio = document.getElementById('win95sound');
            audio.currentTime = 0;
            audio.play();
        }
    </script>
</body>
</html>
